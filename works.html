<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品一覧</title>
  <link rel="stylesheet" href="works.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-[#142A6E] to-[#0B1020] text-white min-h-screen">
  <main>
    <header class="max-w-5xl mx-auto px-5 pt-16">
      <p class="text-xs tracking-widest text-[#D9E2FF]">WORKS</p>
      <h1 class="text-3xl font-bold mt-2">作品一覧</h1>
      <p class="text-[#D9E2FF]/80 mt-2">制作物を一覧で掲載しています。</p>
      <a href="index.html" class="inline-block mt-4 text-[#D9E2FF] hover:underline">← トップへ戻る</a>
    </header>

    <section class="max-w-5xl mx-auto px-5 mt-10 grid gap-4" aria-label="作品一覧" id="works-list"></section>
  </main>
  <div id="work-modal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm js-modal-close"></div>
    <div class="relative z-10 w-[900px] max-w-[92%] max-h-[85vh] overflow-y-auto rounded-2xl border border-white/20 bg-white/10 backdrop-blur-xl shadow-2xl shadow-black/60">
      <div class="pointer-events-none absolute inset-0 rounded-2xl bg-gradient-to-br from-white/30 via-white/10 to-transparent"></div>
      <div class="relative z-10 p-6 md:p-8">
        <button class="absolute top-3 right-4 text-white/80 hover:text-white text-xl js-modal-close transition">×</button>
        <div class="grid md:grid-cols-2 gap-6">
          <figure class="border border-white/10 rounded-lg overflow-hidden bg-white/5">
            <img class="work-modal-image w-full h-full object-cover">
          </figure>
          <div class="flex flex-col">
            <p class="text-sm text-[#D9E2FF] opacity-80">WORK DETAIL</p>
            <h2 class="work-modal-title text-white text-2xl font-bold mt-1">
            </h2>
            <div class="mt-4 space-y-3">
              <div class="border border-white/10 rounded-lg p-3 bg-white/5">
                <p class="text-xs text-[#D9E2FF]">作成期間</p>
                <p class="work-modal-period text-white"></p>
              </div>
              <div class="border border-white/10 rounded-lg p-3 bg-white/5">
                <p class="text-xs text-[#D9E2FF]">使用技術</p>
                <p class="work-modal-tech text-white"></p>
              </div>
            </div>
            <div class="mt-4">
              <p class="text-sm text-[#D9E2FF]">作品概要</p>
              <p class="work-modal-detail text-[#D9E2FF]/80 text-sm leading-relaxed mt-1"></p>
            </div>
            <div class="mt-4">
              <p class="text-sm text-[#D9E2FF]">制作過程</p>
              <p class="work-modal-process text-[#D9E2FF]/80 text-sm leading-relaxed mt-1"></p>
            </div>
            <a href="#" class="work-modal-link mt-auto flex items-center justify-center px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white text-sm hover:bg-white/20 transition" aria-label="作品へ移動">
              作品へ移動
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
