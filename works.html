<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品一覧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="works.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-[#142A6E] to-[#0B1020] text-white min-h-screen">
  <main>
    <header class="max-w-5xl mx-auto px-5 pt-10 sm:pt-16 reveal">
      <p class="text-xs font-['Space_Grotesk'] font-bold tracking-widest text-cyan-300">WORKS</p>
      <h1 class="text-3xl font-bold mt-2">作品一覧</h1>
      <p class="text-[#D9E2FF]/80 mt-2">制作物を一覧で掲載しています。</p>
      <a href="index.html" class="inline-block mt-4 text-[#D9E2FF] hover:text-cyan-300 hover:underline transition">← トップへ戻る</a>
    </header>

    <section class="max-w-5xl mx-auto px-5 mt-8 sm:mt-10 grid gap-4" aria-label="作品一覧" id="works-list"></section>
  </main>
  <div id="work-modal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm js-modal-close"></div>
    <div class="work-modal-panel relative z-10 border border-white/20 bg-white/10 backdrop-blur-xl shadow-2xl shadow-black/60">
      <div class="pointer-events-none absolute inset-0 rounded-2xl bg-gradient-to-br from-white/30 via-white/10 to-transparent"></div>
      <div class="work-modal-content relative z-10">
        <button type="button" class="work-modal-close js-modal-close" aria-label="モーダルを閉じる">×</button>
        <div class="work-modal-layout">
          <figure class="work-modal-gallery">
            <img class="work-modal-image" alt="">
            <button type="button" class="work-gallery-button work-gallery-prev" aria-label="前の画像を表示">&lt;</button>
            <button type="button" class="work-gallery-button work-gallery-next" aria-label="次の画像を表示">&gt;</button>
            <p class="work-gallery-counter" aria-live="polite"></p>
          </figure>
          <div class="work-modal-info">
            <p class="work-modal-eyebrow">WORK DETAIL</p>
            <h2 class="work-modal-title"></h2>
            <div class="work-modal-meta">
              <div class="work-modal-meta-item">
                <p>作成期間</p>
                <strong class="work-modal-period"></strong>
              </div>
              <div class="work-modal-meta-item">
                <p>使用技術</p>
                <strong class="work-modal-tech"></strong>
              </div>
            </div>
            <a href="#" class="work-modal-link" aria-label="作品へ移動">作品へ移動</a>
            <section class="work-modal-section work-modal-overview">
              <h3>作品概要</h3>
              <p class="work-modal-detail whitespace-pre-line"></p>
            </section>
          </div>
          <section class="work-modal-section work-modal-process-section">
            <h3>制作過程</h3>
            <p class="work-modal-process whitespace-pre-line"></p>
          </section>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
