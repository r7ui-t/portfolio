<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品一覧</title>
  <link rel="stylesheet" href="works.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-[#142A6E] to-[#0B1020] text-white min-h-screen">
  <main>
    <header class="max-w-5xl mx-auto px-5 pt-16">
      <p class="text-xs tracking-widest text-[#D9E2FF]">WORKS</p>
      <h1 class="text-3xl font-bold mt-2">作品一覧</h1>
      <p class="text-[#D9E2FF]/80 mt-2">制作物を一覧で掲載しています。</p>
      <a href="index.html" class="inline-block mt-4 text-[#D9E2FF] hover:underline">← トップへ戻る</a>
    </header>

    <section class="max-w-5xl mx-auto px-5 mt-10 grid gap-4" aria-label="作品一覧">  
    <article class="relative border border-white/10 rounded-xl p-5 pr-16 bg-white/10 backdrop-blur-lg hover:bg-white/15 hover:-translate-y-1 hover:shadow-xl transition">
        <h2 class="text-white text-lg font-semibold">ポートフォリオサイト</h2>
        <p class="text-[#D9E2FF]/80 text-sm mt-2">HTML/CSSで制作したポートフォリオサイト。</p>
        <div class="absolute right-4 top-1/2 -translate-y-1/2 flex gap-2">
          <button type="button" class="js-work-modal-trigger hover:scale-110 transition" aria-label="作品情報" data-modal-title="ポートフォリオサイト" 
            data-modal-period="2026年6月-2026年7月" data-modal-tech="HTML, CSS, JavaScript" data-modal-detail="情報リテラシーの課題で作成。HTML/CSS/JavaScriptを用いた自身のポートフォリオサイトです。" 
            data-modal-process="初めに、メディアデザイン入門で学んでいたプロトタイピングを行い大まかなレイアウトを決めました。その後実際にHTMLやCSSを用いてコードを記述していったのですが、CSSの知識が素人レベルだったため思っていたレイアウトに仕上げるのは困難でAIの力も借り作成することができました。" 
            data-modal-image="image\preview-image\portfolio-site.jpg">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                <path d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0"/>
              </svg>
          </button>
          <a href="index.html#works" rel="noopener noreferrer" class="hover:scale-110 transition" aria-label="ポートフォリオサイトを開く">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
              <path fill-rule="evenodd" d="M15 2a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1zM0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm5.854 3.146a.5.5 0 1 0-.708.708L9.243 9.95H6.475a.5.5 0 1 0 0 1h3.975a.5.5 0 0 0 .5-.5V6.475a.5.5 0 1 0-1 0v2.768z"/>
            </svg>
          </a>
        </div>
      </article>

      <article class="relative border border-white/10 rounded-xl p-5 pr-16 bg-white/10 backdrop-blur-lg hover:bg-white/15 hover:-translate-y-1 hover:shadow-xl transition">
        <h2 class="text-white text-lg font-semibold">Slay The Spire - Scratch version</h2>
        <p class="text-[#D9E2FF]/80 text-sm mt-2">Scratch3.0を用いて作成したSlay The Spireの再現版。Silentでのボスグレムリン戦を再現しています。</p>
        <div class="absolute right-4 top-1/2 -translate-y-1/2 flex gap-2">
          <button type="button" class="js-work-modal-trigger hover:scale-110 transition" aria-label="作品情報を見る" data-modal-title="Slay The Spire - Scratch version" data-modal-period="2026年5月-2026年6月" data-modal-tech="Scratch 3.0" 
          data-modal-detail="プログラミング入門の期末課題で作成したSlayTheSpireのScratch版です。サイレントというキャラクターを使用し、ボスグレムリンというエリートボスを倒すシーンを再現してあります。"
          data-modal-process="カードがどの場所から使用されたのかを記録し、次にカードをドローする際に常に一番左の空きスロットへ補充されるようにするのが苦労しました。" 
          data-modal-image="image\preview-image\scratch-slay-the-spire.jpg">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
              <path d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0"/>
            </svg>
          </button>
          <a href="https://scratch.mit.edu/projects/1333302307/" target="_blank" rel="noopener noreferrer" class="hover:scale-110 transition" aria-label="Scratch作品を開く">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
              <path fill-rule="evenodd" d="M15 2a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1zM0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm5.854 3.146a.5.5 0 1 0-.708.708L9.243 9.95H6.475a.5.5 0 1 0 0 1h3.975a.5.5 0 0 0 .5-.5V6.475a.5.5 0 1 0-1 0v2.768z"/>
            </svg>
          </a>
        </div>
      </article>

      <article class="relative border border-white/10 rounded-xl p-5 pr-16 bg-white/10 backdrop-blur-lg hover:bg-white/15 hover:-translate-y-1 hover:shadow-xl transition">
        <h2 class="text-white text-lg font-semibold">PictDict</h2>
        <p class="text-[#D9E2FF]/80 text-sm mt-2">日常のピクトグラムを記録する図鑑</p>
        <div class="absolute right-4 top-1/2 -translate-y-1/2 flex gap-2">
          <button type="button" class="js-work-modal-trigger hover:scale-110 transition" aria-label="作品情報" data-modal-title="PictDict" data-modal-period="2025年5月" data-modal-tech="Django, Python, HTML, CSS"
            data-modal-detail="こちらも情報リテラシーの課題で作成したもの。ピクトグラムの写真と場所、メモを記録することができる。PictDictという名前はピクトグラム+ディクショナリー(辞書)の造語です。" 
            data-modal-process="Djangoで作ったウェブサイト、公開環境がないため未公開です。バックエンドにはDjangoを使用している。CRUDアプリの作成は久しぶりだったので懐かしい気持ちで取り組むことができたが、やはりCSSが一番の難点で完全に自分の力のみで作成することはできなかった" 
            data-modal-image="image\preview-image\pictdict-preview.jpg">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                <path d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0"/>
              </svg>
          </button>
          <a href="https://github.com/r7ui-t/PictDict" target="_blank" rel="noopener noreferrer" class="hover:scale-110 transition" aria-label="GitHubリポジトリを開く">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
              <path fill-rule="evenodd" d="M15 2a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1zM0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm5.854 3.146a.5.5 0 1 0-.708.708L9.243 9.95H6.475a.5.5 0 1 0 0 1h3.975a.5.5 0 0 0 .5-.5V6.475a.5.5 0 1 0-1 0v2.768z"/>
            </svg>
          </a>
        </div>
      </article>
    </section>
  </main>
  <div id="work-modal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm js-modal-close"></div>
    <div class="relative z-10 w-[900px] max-w-[92%] max-h-[85vh] overflow-y-auto rounded-2xl border border-white/20 bg-white/10 backdrop-blur-xl shadow-2xl shadow-black/60">
      <div class="pointer-events-none absolute inset-0 rounded-2xl bg-gradient-to-br from-white/30 via-white/10 to-transparent"></div>
      <div class="relative z-10 p-6 md:p-8">
        <button class="absolute top-3 right-4 text-white/80 hover:text-white text-xl js-modal-close transition">×</button>
        <div class="grid md:grid-cols-2 gap-6">
          <figure class="border border-white/10 rounded-lg overflow-hidden bg-white/5">
            <img class="work-modal-image w-full h-full object-cover">
          </figure>
          <div class="flex flex-col">
            <p class="text-sm text-[#D9E2FF] opacity-80">WORK DETAIL</p>
            <h2 class="work-modal-title text-white text-2xl font-bold mt-1">
            </h2>
            <div class="mt-4 space-y-3">
              <div class="border border-white/10 rounded-lg p-3 bg-white/5">
                <p class="text-xs text-[#D9E2FF]">作成期間</p>
                <p class="work-modal-period text-white"></p>
              </div>
              <div class="border border-white/10 rounded-lg p-3 bg-white/5">
                <p class="text-xs text-[#D9E2FF]">使用技術</p>
                <p class="work-modal-tech text-white"></p>
              </div>
            </div>
            <div class="mt-4">
              <p class="text-sm text-[#D9E2FF]">作品概要</p>
              <p class="work-modal-detail text-[#D9E2FF]/80 text-sm leading-relaxed mt-1"></p>
            </div>
            <div class="mt-4">
              <p class="text-sm text-[#D9E2FF]">制作過程</p>
              <p class="work-modal-process text-[#D9E2FF]/80 text-sm leading-relaxed mt-1"></p>
            </div>
            <a href="#" class="work-modal-link mt-auto flex items-center justify-center px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white text-sm hover:bg-white/20 transition" aria-label="作品へ移動">
              作品へ移動
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
